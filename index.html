<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0B2540">
<title>دليل توزيع القطاعات - منطقة المدينة المنورة</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<style>
  :root{
    --navy-950:#081B2E;
    --navy-900:#0B2540;
    --navy-800:#123255;
    --teal-600:#0E7C7B;
    --teal-500:#14919B;
    --teal-400:#3BB4B0;
    --amber-500:#D9A441;
    --amber-400:#E9BE6B;
    --paper:#F5F7F8;
    --card:#FFFFFF;
    --ink-900:#132630;
    --ink-600:#4C6270;
    --ink-400:#8098A3;
    --line:#DDE6E9;
    --radius:14px;
    --shadow: 0 4px 18px rgba(11,37,64,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Tahoma','Segoe UI',Arial,sans-serif;
    background:var(--paper);
    color:var(--ink-900);
    -webkit-font-smoothing:antialiased;
  }

  /* ===== Header ===== */
  header.app-header{
    background:linear-gradient(135deg,var(--navy-950) 0%,var(--navy-800) 100%);
    color:#fff;
    padding:18px 20px 22px;
    position:relative;
    overflow:hidden;
  }
  header.app-header::before{
    content:"";
    position:absolute;
    inset:0;
    background-image: radial-gradient(circle at 85% -10%, rgba(20,145,155,0.35), transparent 55%),
                       radial-gradient(circle at 5% 120%, rgba(217,164,65,0.18), transparent 45%);
    pointer-events:none;
  }
  .header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
    z-index:1;
    gap:10px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg,var(--teal-500),var(--amber-500));
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;color:var(--navy-950);
    flex-shrink:0;
  }
  .brand-text h1{
    font-size:16px;margin:0;font-weight:700;letter-spacing:.2px;
  }
  .brand-text p{
    margin:1px 0 0;font-size:11.5px;color:rgba(255,255,255,0.65);
  }
  .header-stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:16px;
    position:relative;
    z-index:1;
  }
  .stat-pill{
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;
    padding:8px 6px;
    text-align:center;
  }
  .stat-pill b{
    display:block;font-size:17px;color:var(--amber-400);font-weight:700;
  }
  .stat-pill span{
    font-size:10px;color:rgba(255,255,255,0.7);
  }

  /* ===== Search & Filters ===== */
  .controls{
    padding:14px 16px 8px;
    background:var(--paper);
    position:sticky;top:0;z-index:20;
    box-shadow:0 2px 0 var(--line);
  }
  .search-box{
    position:relative;
    display:flex;
    align-items:center;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:0 12px;
    height:46px;
    transition:border-color .15s;
  }
  .search-box:focus-within{
    border-color:var(--teal-500);
    box-shadow:0 0 0 3px rgba(20,145,155,0.14);
  }
  .search-box svg{flex-shrink:0;color:var(--ink-400);}
  .search-box input{
    flex:1;border:none;background:transparent;outline:none;
    font-size:14.5px;padding:0 8px;color:var(--ink-900);
    font-family:inherit;
  }
  .search-box input::placeholder{color:var(--ink-400);}
  .clear-btn{
    border:none;background:var(--line);color:var(--ink-600);
    width:22px;height:22px;border-radius:50%;font-size:13px;
    cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0;
  }
  .filters-row{
    display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px;
    scrollbar-width:none;align-items:center;
  }
  .filters-row::-webkit-scrollbar{display:none;}
  select.filter-select{
    -webkit-appearance:none;appearance:none;
    background:var(--card) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%234C6270"/></svg>') left 10px center no-repeat;
    border:1.5px solid var(--line);
    border-radius:20px;
    padding:8px 26px 8px 12px;
    font-size:12.5px;
    color:var(--ink-900);
    white-space:nowrap;
    flex-shrink:0;
    font-family:inherit;
    cursor:pointer;
  }
  select.filter-select:focus{outline:none;border-color:var(--teal-500);}
  .view-toggle{
    display:flex;gap:4px;background:var(--line);border-radius:20px;padding:3px;flex-shrink:0;
    margin-inline-start:auto;
  }
  .view-toggle button{
    border:none;background:transparent;padding:6px 12px;border-radius:16px;
    font-size:12px;color:var(--ink-600);cursor:pointer;font-family:inherit;font-weight:600;
    white-space:nowrap;
  }
  .view-toggle button.active{
    background:var(--navy-900);color:#fff;
  }

  .result-count{
    padding:10px 16px 4px;font-size:12px;color:var(--ink-600);
    display:flex;align-items:center;justify-content:space-between;
  }
  .result-count b{color:var(--navy-900);}

  /* ===== Breadcrumb ===== */
  .breadcrumb{
    display:flex;align-items:center;gap:8px;padding:10px 16px 0;
  }
  .back-btn{
    display:flex;align-items:center;gap:5px;
    border:1px solid var(--line);background:var(--card);
    border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600;
    color:var(--navy-900);cursor:pointer;font-family:inherit;flex-shrink:0;
  }
  .back-btn svg{width:14px;height:14px;}
  .crumb-path{
    font-size:12px;color:var(--ink-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .crumb-path b{color:var(--navy-900);}

  /* ===== List ===== */
  #listView{padding:6px 16px 90px;}

  .nav-row{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:9px;
    box-shadow:var(--shadow);
    cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    transition:transform .12s;
  }
  .nav-row:active{transform:scale(0.99);}
  .nav-row-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .nav-avatar{
    width:38px;height:38px;border-radius:10px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;color:#fff;
  }
  .nav-avatar.eng{background:linear-gradient(135deg,var(--navy-800),var(--teal-600));}
  .nav-avatar.sup{background:linear-gradient(135deg,var(--teal-600),var(--teal-400));}
  .nav-title{font-size:14px;font-weight:700;color:var(--ink-900);}
  .nav-sub{font-size:11.5px;color:var(--ink-400);margin-top:2px;}
  .nav-chevron{color:var(--ink-400);flex-shrink:0;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:13px 14px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
    cursor:pointer;
    transition:transform .12s, box-shadow .12s;
  }
  .card:active{transform:scale(0.99);}
  .card-top{
    display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  }
  .card-title{
    font-size:14.5px;font-weight:700;color:var(--ink-900);line-height:1.4;
  }
  .badge{
    font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;flex-shrink:0;
    white-space:nowrap;
  }
  .badge.school{background:rgba(20,145,155,0.12);color:var(--teal-600);}
  .badge.admin{background:rgba(217,164,65,0.15);color:#9C6E15;}
  .card-code{font-size:10.5px;color:var(--ink-400);margin-top:2px;}
  .card-meta{
    display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:10px;
    border-top:1px dashed var(--line);padding-top:9px;
  }
  .meta-item{font-size:12px;color:var(--ink-600);display:flex;align-items:center;gap:5px;}
  .meta-item b{color:var(--ink-900);font-weight:600;}
  .meta-icon{
    width:15px;height:15px;flex-shrink:0;opacity:0.65;
  }
  .share-btn{
    margin-inline-start:auto;
    border:1px solid var(--line);background:var(--paper);
    border-radius:8px;width:30px;height:30px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:var(--teal-600);
  }
  .share-btn:active{background:var(--line);}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-400);
  }
  .empty-state svg{margin-bottom:10px;opacity:0.5;}
  .empty-state p{font-size:13.5px;margin:0;}

  /* ===== Map ===== */
  #mapView{display:none;height:calc(100vh - 178px);position:relative;}
  #map{width:100%;height:100%;}
  .leaflet-popup-content{font-family:'Tahoma','Segoe UI',Arial,sans-serif;direction:rtl;text-align:right;font-size:12.5px;}
  .leaflet-popup-content b{display:block;font-size:13.5px;margin-bottom:4px;color:var(--navy-900);}
  .map-hint{
    position:absolute;bottom:12px;right:12px;left:12px;
    background:rgba(255,255,255,0.95);
    border-radius:10px;padding:8px 12px;font-size:11.5px;color:var(--ink-600);
    box-shadow:var(--shadow);z-index:400;text-align:center;
    pointer-events:none;
  }

  /* ===== Detail modal ===== */
  .overlay{
    position:fixed;inset:0;background:rgba(8,27,46,0.55);
    display:none;align-items:flex-end;justify-content:center;z-index:100;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;
    padding:20px 20px 26px;max-height:82vh;overflow-y:auto;
    animation:slideUp .22s ease-out;
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-handle{width:36px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 16px;}
  .sheet h2{font-size:17px;margin:0 0 4px;color:var(--navy-900);}
  .sheet .sheet-code{font-size:11.5px;color:var(--ink-400);margin-bottom:16px;}
  .sheet-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--line);
  }
  .sheet-row:last-of-type{border-bottom:none;}
  .sheet-row .label{font-size:12px;color:var(--ink-600);display:flex;align-items:center;gap:6px;}
  .sheet-row .value{font-size:13.5px;font-weight:700;color:var(--ink-900);}
  .sheet-actions{display:flex;gap:8px;margin-top:16px;}
  .sheet-actions button{
    flex:1;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn-map{background:var(--navy-900);color:#fff;}
  .btn-share{background:rgba(20,145,155,0.12);color:var(--teal-600);}
  .btn-close{background:var(--line);color:var(--ink-900);}

  /* ===== Toast ===== */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--navy-950);color:#fff;padding:11px 20px;border-radius:24px;
    font-size:12.5px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,0.25);
    opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (min-width:760px){
    #listView.grid-cards{
      display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
      align-content:start;
    }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-top">
    <div class="brand">
      <div class="brand-mark">TBC</div>
      <div class="brand-text">
        <h1>دليل توزيع القطاعات</h1>
        <p>منطقة المدينة المنورة — م. كارم أنيس عوض</p>
      </div>
    </div>
  </div>
  <div class="header-stats" id="headerStats"></div>
</header>

<div class="controls">
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input id="searchInput" type="text" placeholder="ابحث باسم المدرسة، المشرف، أو المهندس...">
    <button class="clear-btn" id="clearBtn">✕</button>
  </div>
  <div class="filters-row">
    <select class="filter-select" id="typeFilter">
      <option value="">كل الأنواع</option>
      <option value="مدرسة">مدارس فقط</option>
      <option value="مبنى إداري">مباني إدارية فقط</option>
    </select>
    <div class="view-toggle">
      <button id="btnListView" class="active">قائمة</button>
      <button id="btnMapView">خريطة</button>
    </div>
  </div>
</div>

<div class="breadcrumb" id="breadcrumb" style="display:none;">
  <button class="back-btn" id="backBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
    رجوع
  </button>
  <div class="crumb-path" id="crumbPath"></div>
</div>

<div class="result-count" id="resultCount"></div>

<div id="listView"></div>

<div id="mapView">
  <div id="map"></div>
  <div class="map-hint">اضغط على أي علامة لعرض التفاصيل</div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="sheetTitle"></h2>
    <div class="sheet-code" id="sheetCode"></div>
    <div id="sheetBody"></div>
    <div class="sheet-actions">
      <button class="btn-map" id="sheetMapBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
        الخريطة
      </button>
      <button class="btn-share" id="sheetShareBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 3.9M15.4 6.6L8.6 10.5"/></svg>
        مشاركة الموقع
      </button>
      <button class="btn-close" id="sheetCloseBtn">إغلاق</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>

// ---------- normalize helper for Arabic search ----------
function norm(s){
  if(!s) return '';
  return s.toString()
    .replace(/[إأآا]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/ؤ/g,'و')
    .replace(/ئ/g,'ي')
    .replace(/[\u064B-\u0652]/g,'')
    .trim()
    .toLowerCase();
}

  return `
  <div class="nav-row" data-nav="${kind}" data-name="${encodeURIComponent(name)}">
    <div class="nav-row-left">
      <div class="nav-avatar ${cls}">${initial}</div>
      <div>
        <div class="nav-title">${name}</div>
        <div class="nav-sub">${count} ${kind==='eng' ? 'موقع تحت إشرافه' : 'موقع'}</div>
      </div>
    </div>
    <svg class="nav-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
  </div>`;
}

function updateBreadcrumb(){
  if(searchInput.value.trim()){ breadcrumbEl.style.display='none'; return; }
  if(navLevel===0){ breadcrumbEl.style.display='none'; return; }
  breadcrumbEl.style.display='flex';
  if(navLevel===1){
    crumbPath.innerHTML = `<b>${navEngineer}</b> — اختر مشرفًا`;
  } else if(navLevel===2){
    crumbPath.innerHTML = `<b>${navEngineer}</b> ← <b>${navSupervisor}</b>`;
  }
}

function render(){
  const query = norm(searchInput.value);
  listView.classList.remove('grid-cards');

  if(query){
    // ---- flat search mode across schools/buildings ----
    currentResults = DATA.filter(d=>{
      if(!typeMatch(d)) return false;
      const hay = norm([d.name,d.supervisor,d.engineer,d.manager,d.city,d.code].join(' '));
      return hay.includes(query);
    });
    resultCount.innerHTML = `<span><b>${currentResults.length}</b> نتيجة بحث</span>`;
    renderLeafList(currentResults);
    updateBreadcrumb();
    updateMap();
    return;
  }

  // ---- browse / drill-down mode ----
  if(navLevel===0){
    const rows = engineers
      .map(eng=>({name:eng, items:DATA.filter(d=>d.engineer===eng && typeMatch(d))}))
      .filter(r=>r.items.length>0);
    resultCount.innerHTML = `<span>اختر <b>مهندس المرافق</b> لعرض المشرفين التابعين له</span>`;
    if(rows.length===0){
      listView.innerHTML = emptyStateHTML();
    } else {
      listView.innerHTML = rows.map(r=>navRowHTML('eng', r.name, r.items.length)).join('');
    }
    currentResults = DATA.filter(typeMatch);
  } else if(navLevel===1){
    const sups = [...new Set(DATA.filter(d=>d.engineer===navEngineer).map(d=>d.supervisor).filter(Boolean))]
      .sort((a,b)=>a.localeCompare(b,'ar'));
    const rows = sups
      .map(sup=>({name:sup, items:DATA.filter(d=>d.engineer===navEngineer && d.supervisor===sup && typeMatch(d))}))
      .filter(r=>r.items.length>0);
    resultCount.innerHTML = `<span><b>${rows.length}</b> مشرف تحت إشراف ${navEngineer}</span>`;
    if(rows.length===0){
      listView.innerHTML = emptyStateHTML();
    } else {
      listView.innerHTML = rows.map(r=>navRowHTML('sup', r.name, r.items.length)).join('');
    }
    currentResults = DATA.filter(d=>d.engineer===navEngineer && typeMatch(d));
  } else if(navLevel===2){
    const items = DATA.filter(d=>d.engineer===navEngineer && d.supervisor===navSupervisor && typeMatch(d));
    resultCount.innerHTML = `<span><b>${items.length}</b> موقع تحت إشراف ${navSupervisor}</span>`;
    renderLeafList(items);
    currentResults = items;
  }

  updateBreadcrumb();
  updateMap();
}

function emptyStateHTML(){
  return `<div class="empty-state">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <p>لا توجد نتائج مطابقة</p>
    </div>`;
}

function renderLeafList(items){
  listView.classList.add('grid-cards');
  if(items.length===0){
    listView.innerHTML = emptyStateHTML();
    return;
  }
  const shown = items.slice(0, 400);
  listView.innerHTML = shown.map(d=>cardHTML(d)).join('');
}

listView.addEventListener('click', e=>{
  const shareBtn = e.target.closest('.share-btn');
  if(shareBtn){
    e.stopPropagation();
    shareLocation(DATA[+shareBtn.dataset.shareIdx]);
    return;
  }
  const navRow = e.target.closest('.nav-row');
  if(navRow){
    const kind = navRow.dataset.nav;
    const name = decodeURIComponent(navRow.dataset.name);
    if(kind==='eng'){
      navEngineer = name; navLevel = 1;
    } else if(kind==='sup'){
      navSupervisor = name; navLevel = 2;
    }
    render();
    listView.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  const card = e.target.closest('.card');
  if(card){
    openSheet(DATA[+card.dataset.idx]);
  }
});

backBtn.addEventListener('click', ()=>{
  if(navLevel===2){ navLevel=1; navSupervisor=null; }
  else if(navLevel===1){ navLevel=0; navEngineer=null; }
  render();
});

searchInput.addEventListener('input', ()=>{
  clearBtn.style.display = searchInput.value ? 'flex' : 'none';
  render();
});
clearBtn.addEventListener('click', ()=>{
  searchInput.value=''; clearBtn.style.display='none'; render(); searchInput.focus();
});
typeFilter.addEventListener('change', render);

// ---------- Toast ----------
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

// ---------- Share location ----------
function shareLocation(d){
  if(!d || !d.lat || !d.lng){ showToast('لا توجد إحداثيات لهذا الموقع'); return; }
  const mapsUrl = `https://www.google.com/maps?q=${d.lat},${d.lng}`;
  const shareText = `${d.name}\nموقع على الخريطة: ${mapsUrl}`;
  if(navigator.share){
    navigator.share({title:d.name, text:d.name, url:mapsUrl}).catch(()=>{});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(shareText).then(()=>{
      showToast('تم نسخ رابط الموقع');
    }).catch(()=>{
      window.open(mapsUrl, '_blank');
    });
  } else {
    window.open(mapsUrl, '_blank');
  }
}

// ---------- Detail sheet ----------
const overlay = document.getElementById('overlay');
let sheetTarget = null;
function openSheet(d){
  sheetTarget = d;
  document.getElementById('sheetTitle').textContent = d.name;
  document.getElementById('sheetCode').textContent = [d.code, d.city].filter(Boolean).join(' · ');
  document.getElementById('sheetBody').innerHTML = `
    <div class="sheet-row"><span class="label">النوع</span><span class="value">${d.type}</span></div>
    <div class="sheet-row"><span class="label">المشرف الميداني</span><span class="value">${d.supervisor||'—'}</span></div>
    <div class="sheet-row"><span class="label">مهندس المرافق</span><span class="value">${d.engineer||'—'}</span></div>
    ${d.manager ? `<div class="sheet-row"><span class="label">مدير البرنامج</span><span class="value">${d.manager}</span></div>` : ''}
  `;
  overlay.classList.add('open');
}
document.getElementById('sheetCloseBtn').addEventListener('click', ()=>overlay.classList.remove('open'));
overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.classList.remove('open'); });
document.getElementById('sheetShareBtn').addEventListener('click', ()=>{
  if(sheetTarget) shareLocation(sheetTarget);
});
document.getElementById('sheetMapBtn').addEventListener('click', ()=>{
  overlay.classList.remove('open');
  showMap();
  setTimeout(()=>{
    if(sheetTarget && sheetTarget.lat && sheetTarget.lng){
      map.setView([sheetTarget.lat, sheetTarget.lng], 15);
      markersLayer.eachLayer(m=>{
        if(m._myData === sheetTarget) m.openPopup();
      });
    }
  }, 150);
});

// ---------- View toggle ----------
const listViewEl = document.getElementById('listView');
const mapViewEl = document.getElementById('mapView');
const btnListView = document.getElementById('btnListView');
const btnMapView = document.getElementById('btnMapView');

function showList(){
  listViewEl.style.display='';
  mapViewEl.style.display='none';
  btnListView.classList.add('active');
  btnMapView.classList.remove('active');
}
function showMap(){
  listViewEl.style.display='none';
  mapViewEl.style.display='block';
  btnMapView.classList.add('active');
  btnListView.classList.remove('active');
  if(!map) initMap();
  setTimeout(()=>map.invalidateSize(), 100);
}
btnListView.addEventListener('click', showList);
btnMapView.addEventListener('click', showMap);

// ---------- Map ----------
function initMap(){
  map = L.map('map', {zoomControl:true}).setView([24.47, 39.6], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap',
    maxZoom:19
  }).addTo(map);
  markersLayer = L.markerClusterGroup({maxClusterRadius:50});
  map.addLayer(markersLayer);
  updateMap();
}

function updateMap(){
  if(!markersLayer) return;
  markersLayer.clearLayers();
  currentResults.forEach(d=>{
    if(!d.lat || !d.lng) return;
    const color = d.type==='مدرسة' ? '#0E7C7B' : '#D9A441';
    const marker = L.circleMarker([d.lat, d.lng], {
      radius:7, fillColor:color, color:'#fff', weight:2, fillOpacity:0.95
    });
    marker._myData = d;
    marker.bindPopup(`<b>${d.name}</b>مشرف: ${d.supervisor||'—'}<br>مهندس: ${d.engineer||'—'}`);
    markersLayer.addLayer(marker);
  });
}

// init
render();

// ---------- PWA install ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
